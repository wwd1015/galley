[project]
name = "galley"
version = "0.1.0"
description = "Whitepaper build system: Quarto Markdown in, team-template PDF out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pymupdf>=1.24",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
galley = "galley.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-requests>=2.33.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galley"]

[tool.hatch.build.targets.wheel.force-include]
"_extensions/galley/galley" = "galley/_extension"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["galley", "tests"]
untyped_calls_exclude = ["pymupdf", "docx", "dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "quarto: needs the quarto CLI",
    "tex: needs quarto and a TeX installation",
]
