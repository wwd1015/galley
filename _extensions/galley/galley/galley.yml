# Generated by `galley template adopt` from config/template.yaml. Do not edit.
template: standin
engine: xelatex
cite-method: natbib
tex-packages:
- caption
- enumitem
- fancyhdr
- float
- natbib
- tcolorbox
- tex-gyre
- titlesec
- underscore
tables:
  font-size: small
numbers:
  thousands: ','
  decimal: .
  negative: minus
style:
  pgf: true
  font-family: sans-serif
  font-size: 9
  figure-width: 6.0
  figure-height: 3.2
  line-width: 1.6
  palette:
  - '#14324F'
  - '#C8102E'
  - '#5F6B76'
  - '#7FA3C7'
  - '#E3A008'
  font-check: TeXGyreHeros
  pgf-preamble: '\usepackage{fontspec}

    \setmainfont{texgyrepagella}[Extension=.otf,UprightFont=*-regular,BoldFont=*-bold,ItalicFont=*-italic,BoldItalicFont=*-bolditalic]

    \setsansfont{texgyreheros}[Extension=.otf,UprightFont=*-regular,BoldFont=*-bold,ItalicFont=*-italic,BoldItalicFont=*-bolditalic]

    '
scaffold-metadata:
  document-id: WP-0000-000
  classification: Internal
  version: '0.1'
