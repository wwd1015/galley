# Generated by `galley template adopt` from config/template.yaml. Do not edit.
title: Galley
author: Galley
version: 0.1.0
quarto-required: '>=1.4.0'
contributes:
  formats:
    pdf:
      date-format: MMMM YYYY
      fig-pos: H
      tbl-pos: H
      template: galley.tex
      pdf-engine: xelatex
      cite-method: natbib
      keep-tex: true
      fig-format: pdf
      filters:
      - filters/galley-divs.lua
      - filters/galley-tables.lua
      - filters/galley-review.lua
      - at: post-render
        path: filters/galley-latex.lua
      format-resources:
      - whitepaper.cls
      - logo.pdf
      galley:
        template: standin
        environments:
          keyfinding:
            env: keyfinding
          recommendation:
            env: recommendation
            optional-arg: title
        tables:
          font-size: small
